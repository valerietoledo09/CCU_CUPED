name: School portal review
on:
  push:
    branches:
      - codex/school-portal-review
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: npm test
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start local review server
        run: python -m http.server 3000 --bind 127.0.0.1 > /tmp/cuped-review-server.log 2>&1 &
      - name: Check student and owner flows in a browser
        run: node .github/qa/school-portal.browser.mjs
